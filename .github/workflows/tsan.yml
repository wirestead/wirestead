name: ThreadSanitizer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"

permissions:
  contents: read
  issues: write

jobs:
  tsan:
    name: TSAN focused contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        uses: ./.github/actions/apt-install
        with:
          packages: "build-essential cmake ninja-build clang"

      - name: Install dependencies with vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux

      - name: Configure TSAN build
        run: |
          cmake -S . -B build-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWIRESTEAD_BUILD_TESTS=ON \
            -DWIRESTEAD_ENABLE_SANITIZERS=ON \
            -DWIRESTEAD_ENABLE_TSAN=ON \
            -DWIRESTEAD_ENABLE_ASAN=OFF \
            -DWIRESTEAD_ENABLE_UBSAN=OFF \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE \
            -DVCPKG_TARGET_TRIPLET=$VCPKG_TARGET_TRIPLET

      - name: Build TSAN targets
        run: cmake --build build-tsan --parallel

      - name: Run focused TSAN tests
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1 history_size=7
        run: |
          ctest --test-dir build-tsan --output-on-failure --parallel 2 \
            -R "StopContract|StopFromCallback|TcpClientLifecycle|TcpClientExecutorTest|TcpServerWrapperLifecycle|UdsClientWrapperLifecycle|UdsServerWrapperLifecycle|BackpressureStrategyTest|WrapperSendContractTest|ServerBroadcastContractTest"

      - name: Upload TSAN test logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tsan-test-results
          path: build-tsan/Testing/
          retention-days: 14
          overwrite: true

      # Nothing watches a scheduled run. This one broke on 2026-08-08 and stayed
      # broken for three nights before anyone noticed, so a failed nightly files
      # an issue. Comment on the existing one rather than opening a new issue
      # every 24 hours - one issue per outage, not per night.
      - name: Report a failing nightly
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "ThreadSanitizer nightly is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Exact title match: `in:title` is a full-text search, so a loose
          # match could comment on somebody else's issue instead of filing one.
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$TITLE" --label bug --body "The nightly ThreadSanitizer run failed: $RUN_URL"
          fi
